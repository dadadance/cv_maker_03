<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Maker - Dashboard</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">CV Maker</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Resumes Section -->
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Resumes</h2>
                <p class="text-gray-500">No resumes yet. Create one from a job description.</p>
            </div>

            <!-- Job Descriptions Section -->
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Job Descriptions</h2>
                <p class="text-gray-500">No job descriptions yet. Add one to get started.</p>
            </div>
        </div>
    </div>
</body>
</html>
