[project]
name = "cv-maker-03"
version = "0.1.0"
description = "AI-powered CV/Resume maker with JSON-based storage"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0",
    "django-htmx>=1.27.0",
    "google-genai>=1.56.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.2.0",
    "weasyprint>=67.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
]

[project.scripts]
cvmaker = "cli.main:app"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
